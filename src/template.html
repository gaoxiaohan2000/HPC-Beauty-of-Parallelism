<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPC 之美 · 3D Renderer</title>
<meta name="author" content="意雨轻寒 / Jerry Leibniz">
<style>
  :root { --bg:#05070c; --panel:#0c1018; --line:#1c2433; --text:#d8deea; --dim:#7d879a; --accent:#b26cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  header b { font-weight: 600; letter-spacing: .02em; }
  header span { color: var(--dim); font-size: 12px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #out { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6); }
  #controls { padding: 10px 18px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  .row { display: flex; align-items: center; gap: 12px; }
  button, select { background: #151b27; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #3a4660; }
  button:disabled { opacity: .5; cursor: default; }
  #play { width: 44px; }
  #export { background: linear-gradient(90deg, #6b3fd1, #9b5cff); border-color: transparent; font-weight: 600; }
  #seekwrap { position: relative; flex: 1; padding-top: 18px; }
  #seek { width: 100%; accent-color: var(--accent); }
  #chapters { position: absolute; top: 0; left: 0; right: 0; height: 16px; }
  #chapters button { position: absolute; transform: translateX(0); padding: 0 5px; font-size: 11px; line-height: 15px; border-radius: 3px; background: transparent; color: var(--dim); border: none; border-left: 1px solid #2a3346; }
  #chapters button:hover { color: var(--text); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 190px; }
  #status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #bar { display: none; height: 3px; background: #1a2130; margin-top: 8px; border-radius: 2px; overflow: hidden; }
  #prog { height: 100%; width: 0; background: linear-gradient(90deg, #ffb040, #3cff96, #b26cff); }
  #cancel { display: none; }
</style>
</head>
<body>
<header><b>HPC 之美 · The Beauty of Parallelism</b><span>3D · Three.js + WebGL2 + GLSL · 意雨轻寒 / Jerry Leibniz</span></header>
<div id="stage"><canvas id="out"></canvas></div>
<div id="controls">
  <div class="row">
    <button id="play" title="Space">▶</button>
    <div id="seekwrap"><div id="chapters"></div><input id="seek" type="range" min="0" max="90" value="0"></div>
    <span id="time">00:00.0 / 01:30.0</span>
    <select id="res" title="export resolution"><option value="1080">1080p</option><option value="720">720p</option></select>
    <button id="export">导出 MP4</button>
    <button id="cancel">取消</button>
  </div>
  <div id="bar"><div id="prog"></div></div>
  <div id="status">loading…</div>
</div>
<script>/*__ASSETS__*/</script>
<script>/*__BUNDLE__*/</script>
</body>
</html>
